spring:
  application:
    name: play-detector
  profiles:
    active: dev
  datasource:
    url: jdbc:h2:mem:playdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

# Security & JWT Configurations
jwt:
  secret: 9a4f2c8d3b7a1e5f8c6d4e2b0a8f7c6d5e4b3a2f1c0d9e8b7a6f5e4d3c2b1a0f9a4f2c8d3b7a1e5f8c6d4e2b0a8f7c6d5e4b3a2f1c0d9e8b7a6f5e4d3c2b1a0f
  expiration: 86400000 # 24 Hours in ms

# ML Service Endpoint
ml:
  service:
    url: http://localhost:8000

---

spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://localhost:5432/play_detector
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
