version: '3.8'

services:
  # Database Service
  postgres-db:
    image: postgres:15-alpine
    container_name: playguard-postgres
    environment:
      POSTGRES_DB: play_detector
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Python Machine Learning Microservice
  ml-service:
    build: ./ml-service
    container_name: playguard-ml-service
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    restart: always

  # Spring Boot Backend REST APIs
  backend-api:
    build: ./backend
    container_name: playguard-backend-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/play_detector
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - ML_SERVICE_URL=http://ml-service:8000
    depends_on:
      postgres-db:
        condition: service_healthy
      ml-service:
        condition: service_started
    restart: always

  # Next.js Frontend UI
  frontend-ui:
    build: ./frontend
    container_name: playguard-frontend-ui
    ports:
      - "3000:3000"
    depends_on:
      - backend-api
    restart: always

volumes:
  postgres_data:
